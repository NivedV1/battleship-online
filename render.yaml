services:
  - type: web
    name: battleship-online
    runtime: docker
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_CLIENT
        value: "true"
      - key: CLIENT_DIST
        value: /app/packages/client/dist
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: battleship-online-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
